name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Download Dalamud
      run: |
        Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
        Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

    - name: Build with dotnet
      run: dotnet build .\HonorificCarousel.sln --configuration Release

    - name: Store artifacts
      uses: actions/upload-artifact@v4
      with:
        name: HonorificCarousel
        path: .\HonorificCarousel\bin\x64\Release\HonorificCarousel\latest.zip
        if-no-files-found: error
        retention-days: 7

    - name: Prepare release asset
      if: startsWith(github.ref, 'refs/tags/')
      run: Copy-Item .\HonorificCarousel\bin\x64\Release\HonorificCarousel\latest.zip .\HonorificCarousel.zip

    - name: Publish GitHub release
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "${{ github.ref_name }}" .\HonorificCarousel.zip --title "${{ github.ref_name }}" --notes "Honorific Carousel ${{ github.ref_name }}" --verify-tag
